<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIRTKIN - Kinshasa Dating</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column}
#splash img{width:100%;height:100%;object-fit:cover;opacity:0.6;position:absolute}
#splash.txt{position:relative;z-index:2;text-align:center}
#splash h1{font-size:52px;letter-spacing:8px;color:#60a5fa;text-shadow:0 0 30px #3b82f6}
.auth{position:fixed;inset:0;z-index:1000;background:#020617;display:none;padding:20px;overflow-y:auto}
.auth.active{display:block}
.box{background:#0f172a;border:1px solid #1e3a8a;border-radius:16px;padding:20px;margin:15px 0}
input,select{width:100%;background:#000;border:1px solid #1e3a8a;border-radius:10px;padding:13px;color:#fff;margin:7px 0}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#1e3a8a,#3b82f6);color:#fff;font-weight:bold;margin-top:10px}
.header{position:fixed;top:0;width:100%;background:#020617;border-bottom:2px solid #1e3a8a;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;z-index:500}
.feed{padding:70px 0 70px;max-width:500px;margin:auto}
.post{background:#0f172a;border:1px solid #1e293b;border-radius:15px;margin:12px;overflow:hidden}
.post-top{display:flex;gap:10px;padding:12px;align-items:center}
.post-top img{width:45px;height:45px;border-radius:50%;border:2px solid #3b82f6}
.post img.main{width:100%;height:420px;object-fit:cover}
.post-actions{display:flex;justify-content:space-around;padding:10px;border-top:1px solid #1e293b}
.post-actions button{background:none;border:none;color:#94a3b8;font-size:14px}
.post-actions button.liked{color:#ef4444}
.nav{position:fixed;bottom:0;width:100%;background:#020617;border-top:1px solid #1e3a8a;display:flex;justify-content:space-around;padding:10px 0;z-index:500}
.nav button{background:none;border:none;color:#64748b;font-size:20px}
.nav button.active{color:#60a5fa}
</style>
</head>
<body>

<!-- SPLASH OMBRE SEXY -->
<div id="splash">
<img src="https://i.ibb.co/8zR9Q4y/kiss-shadow.png" onerror="this.style.background='radial-gradient(circle,#1e3a8a,#000)'">
<div class="txt">
<h1>FLIRTKIN</h1>
<p id="splashT">100% Kinshasa - Trouve l'amour</p>
<p style="margin-top:20px;color:#60a5fa">Chargement...</p>
</div>
</div>

<!-- AUTH OBLIGATOIRE -->
<div id="authPage" class="auth">
<h2 style="text-align:center;color:#60a5fa;margin:20px 0" id="authTitle">Crée ton compte FLIRTKIN</h2>
<div class="box">
<input id="aName" placeholder="Nom complet">
<input id="aAge" type="number" placeholder="Age">
<select id="aSexe"><option>Homme</option><option>Femme</option></select>
<select id="aCommune"><option>Gombe</option><option>Bandal</option><option>Ngaliema</option><option>Limete</option><option>Kalamu</option><option>Masina</option><option>Lingwala</option><option>Kinshasa</option></select>
<select id="aLang"><option value="fr">🇫🇷 Français</option><option value="ln">🇨🇩 Lingala</option><option value="en">🇬🇧 English</option><option value="sw">🇹🇿 Swahili</option></select>
<input id="aPhone" placeholder="WhatsApp +243...">
<input id="aPass" type="password" placeholder="Mot de passe">
<textarea id="aBio" placeholder="Bio: Qui es-tu?" style="width:100%;background:#000;border:1px solid #1e3a8a;border-radius:10px;padding:10px;color:#fff"></textarea>
<button class="btn" onclick="register()" id="btnCreate">CRÉER MON COMPTE 🔥</button>
<p style="text-align:center;margin-top:15px;color:#64748b">Déjà compte? <b onclick="showLoginForm()" style="color:#60a5fa">Se connecter</b></p>
</div>
</div>

<div id="loginPage" class="auth">
<h2 style="text-align:center;color:#60a5fa;margin:40px 0">Connexion</h2>
<div class="box">
<input id="lPhone" placeholder="WhatsApp">
<input id="lPass" type="password" placeholder="Mot de passe">
<button class="btn" onclick="login()">SE CONNECTER</button>
<p style="text-align:center;margin-top:15px;color:#64748b" onclick="showRegisterForm()">← Créer un compte</p>
</div>
</div>

<!-- APP PRINCIPALE FACEBOOK STYLE -->
<div id="app" style="display:none">
<div class="header">
<h1 style="color:#60a5fa;letter-spacing:4px">FLIRTKIN</h1>
<div style="display:flex;gap:10px;align-items:center">
<span id="myNameTop" style="font-size:12px"></span>
<select id="langTop" onchange="setLang(this.value)" style="background:#000;color:#60a5fa;border:1px solid #1e3a8a;border-radius:15px;padding:4px"><option value="fr">FR</option><option value="ln">LN</option><option value="en">EN</option><option value="sw">SW</option></select>
</div>
</div>

<div class="feed" id="feed"></div>

<div class="nav">
<button class="active">🏠</button>
<button onclick="alert('Messages bientôt')">💬</button>
<button onclick="alert('Matches bientôt')">❤️</button>
<button onclick="logout()">⚙️</button>
</div>
</div>

<script>
const TR={
 fr:{splash:"100% Kinshasa - Trouve l'amour",create:"Crée ton compte FLIRTKIN",btnCreate:"CRÉER MON COMPTE 🔥",bio:"Bio: Qui es-tu?",like:"J'aime",comment:"Commenter",whatsapp:"WhatsApp",cherche:"cherche l'amour à"},
 ln:{splash:"100% Kinshasa - Luka bolingo",create:"Sala compte na yo FLIRTKIN",btnCreate:"SALA COMPTE NA NGAI 🔥",bio:"Bio: Nani yo?",like:"Nalingi",comment:"Commentaire",whatsapp:"WhatsApp",cherche:"azali koluka bolingo na"},
 en:{splash:"100% Kinshasa - Find love",create:"Create your FLIRTKIN account",btnCreate:"CREATE MY ACCOUNT 🔥",bio:"Bio: Who are you?",like:"Like",comment:"Comment",whatsapp:"WhatsApp",cherche:"is looking for love in"},
 sw:{splash:"100% Kinshasa - Pata upendo",create:"Fungua akaunti yako FLIRTKIN",btnCreate:"FUNGUA AKAUNTI 🔥",bio:"Bio: Wewe ni nani?",like:"Penda",comment:"Maoni",whatsapp:"WhatsApp",cherche:"anatafuta upendo huko"}
}
let lang='fr';
function setLang(l){lang=l;localStorage.setItem('flirtkin_lang',l);applyLang()}
function applyLang(){let t=TR[lang];document.getElementById('splashT').innerText=t.splash;document.getElementById('authTitle').innerText=t.create;document.getElementById('btnCreate').innerText=t.btnCreate;document.getElementById('aBio').placeholder=t.bio;renderFeed()}

const gens=[
 {name:"Grâce",age:22,com:"Gombe",img:"https://i.pravatar.cc/400?img=5",bio:"Mwana Gombe, naza cool"},
 {name:"Deborah",age:21,com:"Bandal",img:"https://i.pravatar.cc/400?img=9",bio:"Étudiante UPN, j'aime la musique"},
 {name:"Sarah",age:23,com:"Ngaliema",img:"https://i.pravatar.cc/400?img=32",bio:"Entrepreneuse, pas de temps à perdre"},
 {name:"Miriam",age:20,com:"Limete",img:"https://i.pravatar.cc/400?img=26",bio:"Danseuse, rumba forever"},
 {name:"Joel",age:24,com:"Gombe",img:"https://i.pravatar.cc/400?img=15",bio:"Boss à Silikin, respect"},
 {name:"Exaucé",age:25,com:"Kalamu",img:"https://i.pravatar.cc/400?img=12",bio:"Footballeur, cherche femme sérieuse"},
];

function renderFeed(){
 let html='';
 gens.forEach((p,i)=>{
  html+=`<div class="post">
   <div class="post-top"><img src="${p.img}"><div><b>${p.name}, ${p.age}</b><br><small style="color:#64748b">${p.com} • ${TR[lang].cherche} ${p.com}</small></div><span style="margin-left:auto">...</span></div>
   <img class="main" src="${p.img}">
   <div style="padding:12px"><p>${p.bio}</p></div>
   <div class="post-actions">
    <button onclick="this.classList.toggle('liked');this.innerText=this.classList.contains('liked')?'❤️ '+TR[lang].like:'🤍 '+TR[lang].like">🤍 ${TR[lang].like}</button>
    <button>💬 ${TR[lang].comment}</button>
    <button onclick="window.open('https://wa.me/24382000000${i}?text=Salut ${p.name} c est via FLIRTKIN','_blank')">📱 ${TR[lang].whatsapp}</button>
   </div>
  </div>`;
 });
 document.getElementById('feed').innerHTML=html;
}

function register(){
 let u={name:aName.value,age:aAge.value,sexe:aSexe.value,com:aCommune.value,phone:aPhone.value,pass:aPass.value,bio:aBio.value,lang:aLang.value};
 if(!u.name||!u.phone||!u.pass)return alert('Remplis tout BAJI!');
 localStorage.setItem('flirtkin_user',JSON.stringify(u));
 localStorage.setItem('flirtkin_logged','true');
 localStorage.setItem('flirtkin_lang',u.lang);
 lang=u.lang;
 location.reload();
}
function login(){
 let s=JSON.parse(localStorage.getItem('flirtkin_user')||'null');
 if(!s)return alert('Crée un compte d abord');
 if(lPhone.value==s.phone && lPass.value==s.pass){localStorage.setItem('flirtkin_logged','true');location.reload()}else alert('Faux numéro / mot de passe');
}
function showLoginForm(){authPage.classList.remove('active');loginPage.classList.add('active')}
function showRegisterForm(){loginPage.classList.remove('active');authPage.classList.add('active')}
function logout(){localStorage.removeItem('flirtkin_logged');location.reload()}

// START
setTimeout(()=>{splash.style.display='none';
 let logged=localStorage.getItem('flirtkin_logged');
 let savedLang=localStorage.getItem('flirtkin_lang')||'fr'; lang=savedLang; langTop.value=savedLang; aLang.value=savedLang; applyLang();
 if(logged=='true'){
   let u=JSON.parse(localStorage.getItem('flirtkin_user')); myNameTop.innerText=u.name; app.style.display='block'; renderFeed();
 }else{
   authPage.classList.add('active');
 }
},2500);
</script>
</body>
</html>
